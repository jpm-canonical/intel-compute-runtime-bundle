name: Release

on:
  push:
    branches:
      - main
    paths:
      - compute-runtime.version
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read and validate version
        id: version
        run: |
          version="$(tr -d '[:space:]' < compute-runtime.version)"
          [[ "$version" =~ ^[0-9]{2}\.[0-9]{2}\.[0-9]+\.[0-9]+$ ]]
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Build and verify bundle
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          make package

      - name: Create draft release and upload bundle
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          gh release create "$VERSION" \
            --draft \
            --target "${{ github.sha }}" \
            --title "Intel compute-runtime $VERSION" \
            --notes "Package bundle for Intel compute-runtime $VERSION." \
            dist/intel-compute-runtime-amd64.tar.gz

      - name: Publish completed release
        run: gh release edit "${{ steps.version.outputs.value }}" --draft=false --latest
